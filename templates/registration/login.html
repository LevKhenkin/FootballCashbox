{% extends "base.html" %}

{% block title %}Вход — Футбольная касса{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Вход</h1>
  {% if form.errors %}<p class="error">Неверный логин или пароль.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
