{% extends "base.html" %}

{% block title %}Сброс пароля — Футбольная касса{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Сброс пароля</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="primary" type="submit">Сохранить новый пароль</button>
    </form>
  {% else %}
    <p class="error">Ссылка для сброса пароля недействительна или устарела.</p>
    <a class="btn" href="{% url 'password_reset' %}">Запросить новую</a>
  {% endif %}
</div>
{% endblock %}
