{% extends "base.html" %}

{% block title %}Восстановление пароля — Футбольная касса{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Восстановление пароля</h1>
  <p class="muted">Введите email, указанный в профиле. Мы отправим ссылку для сброса пароля.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">Отправить ссылку</button>
    <a class="btn" href="{% url 'login' %}">Назад</a>
  </form>
</div>
{% endblock %}
